[project]
name = "server"
version = "0.1.0"
description = "Agent Demo - FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.6",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "langfuse>=5.0.2",
]

[project.optional-dependencies]
# 无头浏览器（Phase 24）：只有需要「任意网站（无头浏览器）」时才装。
#   uv sync --extra browser && uv run playwright install chromium
# 未安装时 app/browser 仍可导入，/api/config/features 报 browser_available=false。
browser = ["playwright>=1.49"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
