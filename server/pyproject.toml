[project]
name = "server"
version = "0.1.0"
description = "Agent Demo - FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.6",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]
