[project]
name = "server"
version = "0.1.0"
description = "Agent Demo - FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.6",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "pydantic-settings>=2.5",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "langfuse>=5.0.2",
]

[project.optional-dependencies]
# JS 渲染（app/sources/render.py）按需安装；装完还需 `uv run playwright install chromium`。
# 只有来源配置里 render.enabled=true 时才会用到，普通 HTML 抓取不需要它。
render = [
    "playwright>=1.49",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[index]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true